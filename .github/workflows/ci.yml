name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Backstop for the pre-commit secret check (hooks can be skipped or not installed): scans only
  # the commits in this push or PR, so the already-revoked keys in old history don't fail it.
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$BASE..HEAD"; else RANGE="-1 HEAD"; fi
          echo "Scanning: $RANGE"
          gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="$RANGE"

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres with pgvector. tests/test_companion_memory_pg.py builds the companion memory
    # schema in it from the real migration files (tests/pg_schema.py) and tests the SQL the fake
    # database cannot: tenant links, one fact per slot, search, the run claim, the day context.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: memtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d memtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-asyncio

      - name: Run pytest
        env:
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_KEY: dummy
          COMPANION_MEMORY_TEST_DATABASE_URL: postgresql://tester:tester@localhost:5432/memtest
        run: python -m pytest

      # A skipped test passes silently: fail the build if the real-database tests did not run.
      - name: Companion memory tests ran on real Postgres
        env:
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_KEY: dummy
          COMPANION_MEMORY_TEST_DATABASE_URL: postgresql://tester:tester@localhost:5432/memtest
        run: |
          python -m pytest tests/test_companion_memory_pg.py -q -rs | tee pg.out
          if grep -q "skipped" pg.out; then echo "real-database tests were skipped"; exit 1; fi

  frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck
